<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Workspace</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px max(24px, calc((100% - 1120px) / 2));
            background: #fff;
            border-bottom: 1px solid #e5eaf2;
        }

        .brand {
            margin: 0;
            color: #2457d6;
            font-size: 20px;
        }

        header nav {
            margin-left: auto;
        }

        .logout-button {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            background: #dc2626;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .logout-button:hover,
        .logout-button:focus-visible {
            background: #b91c1c;
        }

        .logout-button:focus-visible {
            outline: 2px solid #7f1d1d;
            outline-offset: 2px;
        }

        main {
            width: min(1120px, calc(100% - 40px));
            margin: 48px auto;
        }

        .intro {
            margin-bottom: 28px;
        }

        .intro h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 5vw, 38px);
        }

        .intro p {
            margin: 0;
            color: #5b6474;
            line-height: 1.6;
        }

        .tools {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .tool-card {
            display: block;
            min-height: 185px;
            padding: 22px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(20, 38, 70, 0.05);
            color: inherit;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .tool-card:hover,
        .tool-card:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(20, 38, 70, 0.1);
            outline: 2px solid #2457d6;
            outline-offset: 2px;
        }

        .tool-number {
            display: inline-grid;
            width: 36px;
            height: 36px;
            place-items: center;
            margin-bottom: 14px;
            border-radius: 10px;
            background: #eaf0ff;
            color: #2457d6;
            font-weight: 700;
        }

        .tool-card h2 {
            margin: 0 0 9px;
            font-size: 18px;
        }

        .tool-card p {
            margin: 0;
            color: #5b6474;
            font-size: 14px;
            line-height: 1.55;
        }

        @media (max-width: 520px) {
            header {
                padding: 16px 20px;
            }

            main {
                margin: 32px auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <p class="brand">NLP Workspace</p>
        <nav>
            <a class="logout-button" href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h1>Natural Language Processing</h1>
            <p>Explore tools for analyzing, understanding, and working with text.</p>
        </section>

        <section class="tools" aria-label="NLP tools">
            {% for operation, tool in tools.items() %}
            <a class="tool-card" href="{{ url_for('run_nlp_operation', operation=operation) }}" target="_blank" rel="noopener">
                <span class="tool-number">{{ loop.index }}</span>
                <h2>{{ tool.title }}</h2>
                <p>Open the {{ tool.title }} tool in a new page.</p>
            </a>
            {% endfor %}
        </section>
    </main>
</body>
</html>
