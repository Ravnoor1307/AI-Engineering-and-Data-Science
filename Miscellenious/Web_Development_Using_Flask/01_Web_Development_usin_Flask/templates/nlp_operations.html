<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Operations</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px max(24px, calc((100% - 1120px) / 2));
            background: #fff;
            border-bottom: 1px solid #e5eaf2;
        }
        header strong { color: #2457d6; font-size: 20px; }
        nav { display: flex; gap: 18px; }
        a { color: #2457d6; text-decoration: none; }
        main { width: min(1120px, calc(100% - 40px)); margin: 42px auto; }
        h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 38px); }
        .intro { margin-bottom: 28px; color: #5b6474; line-height: 1.6; }
        .operations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }
        .operations > a {
            display: block;
            min-height: 165px;
            padding: 22px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(20, 38, 70, 0.05);
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .operations > a:hover, .operations > a:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(20, 38, 70, 0.1);
            outline: 2px solid #2457d6;
            outline-offset: 2px;
        }
        .operations > a span {
            display: inline-grid;
            width: 36px;
            height: 36px;
            place-items: center;
            margin-bottom: 14px;
            border-radius: 10px;
            background: #eaf0ff;
            color: #2457d6;
            font-weight: 700;
        }
        h2 { margin: 0 0 9px; font-size: 18px; }
        .operations > a p { margin: 0; color: #5b6474; font-size: 14px; line-height: 1.55; }
        @media (max-width: 520px) {
            header { padding: 16px 20px; }
            nav { gap: 12px; }
            main { margin: 32px auto; }
        }
    </style>
</head>
<body>
    <header>
        <strong>NLP Workspace</strong>
        <nav>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}">Log out</a>
        </nav>
    </header>
    <main>
        <h1>NLP Operations</h1>
        <p class="intro">Choose an operation to submit text and view its analysis.</p>
        <section class="operations" aria-label="Natural language processing operations">
            {% for operation, tool in tools.items() %}
            <a href="{{ url_for('run_nlp_operation', operation=operation) }}" target="_blank" rel="noopener" aria-label="Open {{ tool.title }} in a new tab">
                <span>{{ loop.index }}</span>
                <h2>{{ tool.title }}</h2>
                <p>Open {{ tool.title }} in a new page</p>
            </a>
            {% endfor %}
        </section>
    </main>
</body>
</html>
