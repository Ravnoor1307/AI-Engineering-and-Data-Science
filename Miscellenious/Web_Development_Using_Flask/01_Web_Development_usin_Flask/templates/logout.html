<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <style>
        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(420px, calc(100% - 40px));
            padding: 32px;
            text-align: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(20, 38, 70, 0.08);
        }
        h1 { margin-top: 0; }
        p { color: #5b6474; line-height: 1.5; }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 11px 18px;
            border-radius: 8px;
            background: #2457d6;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>You are logged out</h1>
        <p>Your session has ended. Log in again to continue to the NLP workspace.</p>
        <a href="{{ url_for('login') }}">Return to login</a>
    </main>
</body>
</html>
