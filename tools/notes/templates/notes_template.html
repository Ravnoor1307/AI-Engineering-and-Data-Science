<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="generator" content="AI-Engineering-Foundations notes builder">
<style>
{{ css }}
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<div class="reading-progress" role="presentation"></div>
<div class="sidebar-backdrop" aria-hidden="true"></div>

<div class="layout">

  <nav class="sidebar" aria-label="Table of contents">
    <div class="sidebar-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>AI Engineering Foundations</span>
    </div>

    <div class="toc-title">Contents</div>
    <nav class="toc-nav" aria-label="Section navigation">
{{ toc }}
    </nav>
  </nav>

  <main class="main" id="main-content">
    <button class="mobile-toc-toggle" type="button" aria-label="Open table of contents">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <span>Contents</span>
    </button>

    <div class="content">

      <header class="hero">
        <div class="hero-eyebrow">Unit Study Notes</div>
        <h1>{{ title }}</h1>
        <p class="hero-lede">{{ description }}</p>
        <div class="hero-meta">
{{ meta }}
        </div>
      </header>

{{ content }}

    </div>
  </main>

</div>

<button id="savePdfBtn" class="save-pdf-btn" type="button" aria-label="Save these notes as a PDF">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <polyline points="7 10 12 15 17 10"></polyline>
    <line x1="12" y1="15" x2="12" y2="3"></line>
  </svg>
  <span>Save as PDF</span>
</button>

<button id="backToTop" class="back-to-top" type="button" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="12" y1="19" x2="12" y2="5"></line>
    <polyline points="5 12 12 5 19 12"></polyline>
  </svg>
</button>

<script>
{{ js }}
</script>

</body>
</html>
