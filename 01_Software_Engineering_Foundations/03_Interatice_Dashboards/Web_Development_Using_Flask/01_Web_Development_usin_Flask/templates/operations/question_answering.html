{% extends "nlp_tool_base.html" %}
{% block operation_form %}
<form method="post">
    <label for="text">Source text</label>
    <textarea id="text" name="text" required>{{ values.text }}</textarea>
    <label for="question">Question about the source text</label>
    <textarea id="question" name="question" required>{{ values.question }}</textarea>
    <button type="submit">Find answer</button>
</form>
{% endblock %}
